<!DOCTYPE html>
<!--
  Source for images/og-image.png (the link-preview card).

  It is a 1200x630 card scaled to a fixed fraction of the viewport so a browser
  screenshot can be cropped back to exactly 1200x630 without guessing at the
  capture scale: the card is centred, and its height is always width x 0.525.

  To regenerate: open this page, screenshot the viewport, then
    sips -c $(round W*0.9*0.525) $(round W*0.9) shot.jpg --out crop.png
    sips -z 630 1200 crop.png --out images/og-image.png
  where W is the pixel width of the screenshot.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>OG card source</title>
<style>
  @font-face{font-family:'Space Grotesk';src:url(fonts/space-grotesk-600-latin.woff2) format('woff2');font-weight:600;font-display:block}
  @font-face{font-family:Manrope;src:url(fonts/manrope-latin.woff2) format('woff2');font-weight:200 800;font-display:block}
  @font-face{font-family:'IBM Plex Mono';src:url(fonts/ibm-plex-mono-500-latin.woff2) format('woff2');font-weight:500;font-display:block}

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#000}
  body{display:grid;place-items:center;min-height:100vh}

  /* frame holds the exact 1200:630 ratio at 90% of the viewport width */
  #frame{width:90vw;height:calc(90vw * 630 / 1200);overflow:hidden}
  #card{
    width:1200px;height:630px;position:relative;overflow:hidden;
    transform:scale(calc(90vw / 1200));transform-origin:top left;
    background:oklch(10.5% .012 250);color:oklch(97% .008 240);
    font-family:Manrope,sans-serif;
  }
  #card::before{
    content:"";position:absolute;inset:0;opacity:.6;
    background-image:
      linear-gradient(to right,oklch(30% .025 245/.7) 1px,transparent 1px),
      linear-gradient(to bottom,oklch(30% .025 245/.7) 1px,transparent 1px),
      radial-gradient(circle at 76% 30%,oklch(69% .17 232),transparent 36%);
    background-size:80px 80px,80px 80px,auto;
  }
  .inner{position:relative;height:100%;padding:64px 80px}
  .brand{display:flex;align-items:center;gap:20px;font-family:'Space Grotesk';font-weight:600;font-size:34px}
  .brand img{width:70px;height:70px;border-radius:50%}
  h1{margin:84px 0 0;font-family:'Space Grotesk';font-weight:600;font-size:90px;line-height:1.05;letter-spacing:-.02em}
  h1 span{color:oklch(69% .17 232)}
  p{margin:30px 0 0;font-size:27px;line-height:1.45;color:oklch(69% .025 245);max-width:900px}
  .foot{position:absolute;left:80px;bottom:48px;font-family:'IBM Plex Mono';font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:oklch(58% .022 245)}
</style>
</head>
<body>
<div id="frame">
  <div id="card">
    <div class="inner">
      <div class="brand"><img src="images/logo-176.png" alt="MUMU Solutions">MUMU Solutions</div>
      <h1>Construa hoje.<br><span>Escale amanhã.</span></h1>
      <p>Estratégia, engenharia e operação para transformar desafios complexos em soluções prontas para crescer.</p>
      <div class="foot">Consulting · Engineering · Operations · mumu.solutions</div>
    </div>
  </div>
</div>
</body>
</html>
